name: contribution grid snake

# The contribution calendar is read over GraphQL by the action below, using the
# token this workflow is handed automatically. No personal token is involved and
# nothing is rendered on someone else's server.

on:
  schedule:
    # The grid changes at most once a day. Minutes are offset from the hour
    # because runners are busiest on the hour.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A dispatch that overlaps the next schedule would have two runs of this file
# pushing the same branch. The publisher does not force, so the later one lands on
# a ref it did not fetch. Queuing is enough here; nothing on this branch is worth
# cancelling a finished render for.
concurrency:
  group: publish-output-branch
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Render light and dark grids
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          # The action's own input table says keep_history creates an incremental
          # commit instead of a force push. Only these two files live on `output`,
          # so what that buys is a log of past renders rather than other files
          # being preserved: a force push would rewrite the branch each day.
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
