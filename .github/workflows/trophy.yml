name: trophy

# The v1.0 tag of this action renders the card locally with Deno instead of
# serving it from github-profile-trophy.vercel.app, which is what the hosted URL
# in a README would depend on. See WIDGETS.md for what the card can and cannot
# show for a young account.

on:
  schedule:
    # Ranks move on the scale of weeks, not days.
    - cron: "12 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Shared with snake.yml: both publish to `output` and neither forces.
concurrency:
  group: publish-output-branch
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Render trophy card
        uses: ryo-ma/github-profile-trophy@2ba2fe648c4e9b17d66e01bec285e083ca1824d3 # v1.0
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/github-trophy.svg
          token: ${{ github.token }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
