name: metrics

# Runs in this repository's own Actions runner and commits the rendered SVG back
# to `main`. The action writes through the GitHub API rather than a checkout, so
# there is no `actions/checkout` step here on purpose.

on:
  schedule:
    # Metrics pages through every repository on the account, so of the two
    # renders this is the slow one. Its minutes are offset from the snake's and
    # from the hour, which is when runners are busiest and a scheduled event is
    # most likely to be delayed.
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Render metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ github.token }}
          # Left to itself the action resolves the account from `GET /user`,
          # which for a workflow token is not necessarily the repository owner.
          user: ${{ github.repository_owner }}
          # Pinned because the README links this exact path; the action default
          # happens to produce the same name.
          filename: github-metrics.svg
          plugin_isocalendar: yes
          plugin_languages: yes
